name: Redeem Langrisser Codes

on:
  schedule:
    # 每 12 小时运行一次（UTC 时间：0:00 与 12:00），可按需调整
    - cron: "0 */12 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  redeem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 跨运行去重：拉取上次已领取记录（首次无 artifact 时忽略失败）
      - name: Restore claimed history
        uses: actions/download-artifact@v4
        with:
          name: claimed-history
          path: .
        continue-on-error: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # 安装 Chromium 及其系统依赖（ubuntu-latest 默认已是 root，--with-deps 可用）
          playwright install --with-deps chromium

      # 服务器与角色 ID 从 GitHub Secrets 读取（GAME_SERVER / GAME_ROLE_ID）
      - name: Run redeem script
        env:
          GAME_SERVER: ${{ secrets.GAME_SERVER }}
          GAME_ROLE_ID: ${{ secrets.GAME_ROLE_ID }}
        run: python redeem.py

      # 无论领取成功与否，都把结果推送到钉钉机器人
      - name: Notify DingTalk
        if: always()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify.py

      # 保存已领取记录，供下次运行去重（覆盖同名 artifact 的最新版本）
      - name: Save claimed history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claimed-history
          path: claimed_history.txt
          if-no-files-found: ignore
