name: Redeem Langrisser Codes

on:
  schedule:
    # 每 12 小时运行一次（UTC 时间：0:00 与 12:00），可按需调整
    - cron: "0 */12 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

jobs:
  redeem:
    runs-on: ubuntu-latest
    # 需要将已领取记录提交回仓库，故授予 contents 写权限
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          # 安装 Chromium 及其系统依赖（ubuntu-latest 默认已是 root，--with-deps 可用）
          playwright install --with-deps chromium

      # 服务器与角色 ID 从 GitHub Secrets 读取（GAME_SERVER / GAME_ROLE_ID）
      - name: Run redeem script
        env:
          GAME_SERVER: ${{ secrets.GAME_SERVER }}
          GAME_ROLE_ID: ${{ secrets.GAME_ROLE_ID }}
        run: python redeem.py

      # 无论领取成功与否，都把结果推送到钉钉机器人
      - name: Notify DingTalk
        if: always()
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify.py

      # 跨运行去重：把本次已领取记录提交回仓库，下次 checkout 即能读到。
      # 注意 commit message 带 [skip ci]，避免再次触发本工作流形成死循环。
      - name: Commit claimed history
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add claimed_history.txt
          if git diff --cached --quiet; then
            echo "无历史变更，跳过提交"
          else
            git commit -m "chore: update claimed history [skip ci]"
            git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
            git push origin HEAD:main
          fi
